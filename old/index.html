<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkyCast</title>
    <link rel="icon" type="image/svg+xml" href="images/app-logo.svg" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  </head>
  <body>
    <nav class="nav-bar">
      <div class="brand">
        <img src="images/app-logo.svg" alt="" id="logo" />
        <h1>SkyCast</h1>
      </div>
      <!-- search bar -->
      <div class="search-box">
        <div id="input-sec">
          <input
            placeholder="Enter any location, pincode"
            id="inp"
            onkeyup="betterfunc()"
          />
          <ul class="suggestion"></ul>
        </div>
        <button id="search">Search</button>
      </div>
      <!-- toogle opt -->
      <div class="nav-actions">
        <div class="unit-toggle">
          <button id="unit-btn">°C</button>
        </div>
      </div>
    </nav>
    <div class="dashboard">
      <div class="main-section">
        <div id="map"></div>
        <div class="container">
          <div class="top-section">
            <div class="location-row">
              <img src="images/loc-pointer.svg" alt="" id="pointer" />
              <h2 class="cityName"></h2>
            </div>
            <div class="date-time">
              <div class="date-row">
                <p class="timeStamp"></p>
              </div>
              <div class="time-row">
                <p class="time"></p>
              </div>
            </div>
            <div class="temp-section">
              <div class="temp"></div>
              <img class="weather-icon" />
            </div>
            <p class="condition"></p>
            <p class="feels-like"></p>
            <div class="high-low">
              <p class="high-temp"></p>
              <p class="low-temp"></p>
            </div>
          </div>
        </div>

        <div class="details-1">
          <div class="bottom-data">
            <div class="other-info">
              <img src="images/wind.svg" alt="" class="small-icon" />
              <p>Wind</p>
              <input readonly class="data" id="wind" />
            </div>
            <div class="other-info">
              <img src="images/humidity.svg" alt="" class="small-icon" />
              <p>Humidity</p>
              <input readonly class="data" id="humid" />
            </div>
            <div class="other-info">
              <img src="images/sun-icon.svg" alt="" class="small-icon" />
              <p>UV Index</p>
              <input readonly class="data" id="UV" />
            </div>
            <div class="other-info">
              <img src="images/pressure-icon.svg" alt="" class="small-icon" />
              <p>Pressure</p>
              <input readonly class="data" id="pressure" />
            </div>
            <div class="other-info">
              <img src="images/eye-icon.svg" alt="" class="small-icon" />
              <p>Visibility</p>
              <input readonly class="data" id="visibility" />
            </div>
            <div class="other-info">
              <img src="images/rain-icon.svg" alt="" class="small-icon" />
              <p>Rain %</p>
              <input readonly class="data" id="rain-chance" />
            </div>
            <div class="other-info">
              <img src="images/cloud-cover.svg" alt="" class="small-icon" />
              <p>Cloud Cover</p>
              <input readonly class="data" id="cloud-cover" />
            </div>
            <div class="other-info">
              <img src="images/dew-point.svg" alt="" class="small-icon" />
              <p>Dew Point</p>
              <input readonly class="data" id="dew-point" />
            </div>
          </div>
        </div>
      </div>
      <div class="hourly-tomorrow">
        <div class="forecast-sec">
          <div class="hourly-forecast">
            <h3 class="def-info">🕓 Hourly Forecast</h3>
            <div class="hourly-wrapper">
              <button class="nav-arrow hourly-left">&#10094;</button>
              <div class="hourly-container"></div>
              <button class="nav-arrow hourly-right">&#10095;</button>
            </div>
          </div>
        </div>
        <div class="three-day-forecast">
          <h3 class="def-info">Future Forecast</h3>
          <div class="three-day-cards"></div>
        </div>
      </div>
    </div>
    <footer class="footer">
      <p>Stay Informed Stay Prepared | Made by Avadhoot</p>

      <p id="last-update"></p>
    </footer>
    <script type="module" src="JS/app.js"></script>
  </body>
</html>
